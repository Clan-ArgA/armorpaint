name: Release (Windows)

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Read version
      id: version
      shell: pwsh
      run: |
        $line = Select-String -Path paint/sources/globals.h -Pattern 'manifest_version\s*=\s*"([^"]+)"' | Select-Object -First 1
        if (-not $line) { throw "manifest_version not found in paint/sources/globals.h" }
        $version = $line.Matches[0].Groups[1].Value
        $tag = "v$version"
        if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
          throw "Tag ${{ github.ref_name }} does not match manifest_version ($tag)"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT
    - name: Compile
      working-directory: paint
      run: ../base/make --compile
    - name: Package
      shell: pwsh
      run: |
        if (-not (Test-Path paint/build/out/ArmorPaint.exe)) {
          throw "ArmorPaint.exe not found in paint/build/out"
        }
        Compress-Archive -Path paint/build/out/* -DestinationPath ArmorPaint-${{ steps.version.outputs.version }}-windows-x64.zip
    - name: Publish release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $ghArgs = @("${{ steps.version.outputs.tag }}", "ArmorPaint-$version-windows-x64.zip", "--title", "ArmorPaint $version", "--target", "${{ github.sha }}", "--generate-notes", "--repo", "${{ github.repository }}")
        gh release create @ghArgs
